<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hub Pulse</title>
  </head>
  <body>
    <main>
      <h1>Hub Pulse</h1>
      <p id="status">Checking backend status...</p>
    </main>
    <script>
      fetch("/api/health")
        .then((response) => response.json())
        .then((data) => {
          document.getElementById("status").textContent = `Backend status: ${data.status}`;
        })
        .catch(() => {
          document.getElementById("status").textContent = "Backend is unavailable.";
        });
    </script>
  </body>
</html>
