[project]
name = "surge-bus-backend"
version = "0.1.0"
description = "Backend service for the surge bus simulation"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.117.1",
    "pydantic-settings==2.11.0",
    "tzdata==2025.2",
    "uvicorn==0.37.0",
    "websockets==15.0.1",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==1.18.2",
    "pytest==8.4.2",
    "ruff==0.13.2",
]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
