services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      TRANSIT_DATA_MODE: gtfs
      DESTINATION_ALIASES: '{"Downtown":["10553"],"Commercial-Broadway Station":["8649"]}'
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:3001"
