services:
  backend:
    build:
      context: ./backend
    environment:
      TRANSIT_DATA_MODE: gtfs
      DESTINATION_ALIASES: '{"Downtown":["8649"],"Broadway":["8649"]}'
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "3001:3001"
