services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      TRANSIT_DATA_MODE: gtfs
      DESTINATION_ALIASES: '{"Downtown":["10553"],"Commercial-Broadway Station":["8649"]}'
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
        NEXT_PUBLIC_USE_MOCKS: ${NEXT_PUBLIC_USE_MOCKS:-false}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:3001"
